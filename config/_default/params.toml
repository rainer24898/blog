# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
description = "Blog kỹ thuật của Raiii về lớp vật lý 4G LTE và 5G NR, Linux, lập trình C và mạng máy tính."
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/android-chrome-192x192.png"

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2020
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = "🤓"
    subtitle = "4G LTE · 5G NR · Linux · C"
    avatar   = "img/sm-300.webp"

[article]
    headingAnchor = true
    math          = false
    readingTime   = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

## Comments
[comments]
    enabled = false
